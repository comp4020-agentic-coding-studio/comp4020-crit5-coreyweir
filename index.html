<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asterion</title>
    <meta
      name="description"
      content="A labyrinth, a hunger, and something down there carrying a torch."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <header class="chrome">
      <h1>Asterion</h1>
      <nav aria-label="Primary"><a href="./" title="Asterion">&#8635;</a></nav>
    </header>

    <main class="hud">
      <div class="gauge">
        <div class="gauge__track">
          <div id="hunger-fill" class="gauge__fill" data-low="false"></div>
        </div>
        <div class="gauge__track gauge__track--thin">
          <div id="sword" class="gauge__fill gauge__fill--sword" data-armed="false"></div>
        </div>
      </div>
      <div id="lives" class="lives"></div>
      <div id="score" class="score">0</div>
    </main>

    <p id="overlay" class="overlay" data-visible="false" aria-live="polite"></p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
