<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asterion</title>
    <meta
      name="description"
      content="A labyrinth, a hunger, and something down there carrying a torch."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <header class="chrome">
      <h1>Asterion</h1>
      <nav aria-label="Primary"><a href="./" title="Asterion">&#8635;</a></nav>
    </header>

    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="glyph-life" viewBox="0 0 24 24">
        <path
          d="M12 21.3l-1.4-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.3z"
        />
      </symbol>
      <symbol id="glyph-food" viewBox="0 0 24 24">
        <circle cx="12" cy="14.6" r="8" />
        <path d="M11.1 3.6h1.9v4.8h-1.9z" />
        <path d="M13.2 5.6c2.6-2 5.4-1.5 5.4-1.5s.2 2.7-2.3 4c-2 1.1-3.1.1-3.1-.1z" />
      </symbol>
      <symbol id="glyph-blade" viewBox="0 0 24 24">
        <path d="M12 1l2.2 5.4V15h-4.4V6.4L12 1z" />
        <path d="M6.5 15.4h11v2.2h-11z" />
        <path d="M10.9 18.2h2.2V23h-2.2z" />
      </symbol>
    </svg>

    <canvas id="map" class="map" aria-hidden="true"></canvas>

    <main class="hud">
      <div id="lives" class="lives"></div>

      <p class="tally">
        <span class="score"
          ><span class="score__label">Score</span> <span id="score">0</span></span
        >
        <span id="gain" class="gain" aria-hidden="true"></span>
      </p>

      <div class="gauge" id="gauge" data-low="false">
        <svg class="gauge__glyph" aria-hidden="true"><use href="#glyph-food" /></svg>
        <span class="gauge__track">
          <span id="hunger-fill" class="gauge__fill"></span>
        </span>
      </div>

      <div class="blade" id="sword" data-armed="false">
        <svg class="blade__glyph" aria-hidden="true"><use href="#glyph-blade" /></svg>
        <span class="blade__track">
          <span id="sword-fill" class="blade__fill"></span>
        </span>
      </div>
    </main>

    <div id="wound" class="wound" aria-hidden="true"></div>
    <p id="overlay" class="overlay" data-visible="false" aria-live="polite"></p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
